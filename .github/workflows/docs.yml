name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALMA
        uses: actions/checkout@v4

      - name: Cache GHC and Cabal
        uses: actions/cache@v4
        id: cache-haskell
        with:
          path: |
            ~/.ghcup
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/bin
          key: ${{ runner.os }}-agda-2.8.0-ghc-9.10.1-v2

      - name: Setup Haskell (GHC 9.10.1 + cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: 'latest'

      - name: Add cabal bin to PATH
        run: echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"

      - name: Install Agda 2.8.0
        if: steps.cache-haskell.outputs.cache-hit != 'true'
        run: |
          cabal update
          cabal install Agda-2.8.0 --overwrite-policy=always

      - name: Restore executable permissions
        run: chmod -R +x ~/.cabal/bin || true

      - name: Verify Agda installation
        run: agda --version

      - name: Checkout agda-stdlib v2.4
        run: |
          git clone --depth 1 --branch v2.4 https://github.com/agda/agda-stdlib.git

      - name: Checkout agda-categories 0.3.0
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/agda/agda-categories.git | awk -F'refs/tags/' '{print $2}' | grep -E '^v?0\.3\.0$' | head -n1)
          echo "Resolved agda-categories tag: '${TAG}'"
          : "${TAG:?ERROR: no tag matching 0.3.0 / v0.3.0 found on agda-categories}"
          git clone --depth 1 --branch "$TAG" https://github.com/agda/agda-categories.git

      - name: Patch agda-categories .agda-lib (cubical-compatible + stdlib version)
        run: |
          LIB=agda-categories/agda-categories.agda-lib
          echo "--- $LIB before ---"; cat "$LIB"
          if grep -q '^flags:' "$LIB"; then
            grep -q -- '--cubical-compatible' "$LIB" || sed -i 's/^flags:.*/& --cubical-compatible/' "$LIB"
          else
            printf 'flags: --cubical-compatible\n' >> "$LIB"
          fi
          sed -i 's/standard-library-[0-9.]\+/standard-library-2.4/g' "$LIB"
          echo "--- $LIB after ---"; cat "$LIB"

      - name: Register Agda libraries
        run: |
          mkdir -p ~/.config/agda
          echo "$(pwd)/agda-stdlib/standard-library.agda-lib"     >> ~/.config/agda/libraries
          echo "$(pwd)/agda-categories/agda-categories.agda-lib" >> ~/.config/agda/libraries
          echo "standard-library" >> ~/.config/agda/defaults
          echo "agda-categories"  >> ~/.config/agda/defaults

      - name: Cache Agda interface files
        uses: actions/cache@v4
        with:
          path: |
            _build/
            src/**/*.agdai
            agda-stdlib/**/*.agdai
            agda-categories/**/*.agdai
          key: agda-${{ runner.os }}-${{ hashFiles('src/**/*.agda') }}
          restore-keys: |
            agda-${{ runner.os }}-

      - name: Generate Agda HTML documentation
        run: make html

      - name: Auto-generate Dependency Graphs
        run: |
          agda --dependency-graph=src/deps.dot src/index.agda
          python3 scripts/filter_graph.py

      - name: Copy interactive HTML to docs
        run: |
          cp deps-project.html ./docs/ || true
          cp deps-real.html ./docs/ || true

      - name: Inject interactive graph link into index.html
        run: python3 scripts/inject_links.py

      - name: Debug – list generated files
        run: |
          echo "=== docs/ tree (first 80) ==="
          find ./docs -type f | sort | head -80
          echo ""
          echo "=== index.html / Everything.html locations ==="
          find ./docs -name 'index.html'
          find ./docs -name 'Everything.html'
          echo ""
          echo "=== Sample of absolute links (before fix) ==="
          grep -oP 'href="/[^"]*"' "$(find ./docs -name 'index.html' | head -1)" | head -10 || true

      - name: Rewrite absolute paths for /ALMA/ subpath
        run: |
          find ./docs -type f -name '*.html' \
            -exec sed -i 's|href="/\([^/]\)|href="/ALMA/\1|g' {} +
          find ./docs -type f -name '*.html' \
            -exec sed -i 's|src="/\([^/]\)|src="/ALMA/\1|g' {} +
          find ./docs -type f -name '*.css' \
            -exec sed -i 's|url(/\([^/]\)|url(/ALMA/\1|g' {} +

          echo "=== Sample after fix ==="
          grep -oP 'href="[^"]*"' "$(find ./docs -name 'index.html' | head -1)" | head -10 || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
