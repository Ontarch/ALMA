name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALMA
        uses: actions/checkout@v7

      - name: Setup Haskell (GHC 9.10.1 + cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: 'latest'

      - name: Add cabal bin to PATH
        run: echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"

      - name: Cache cabal directories
        uses: actions/cache@v6
        id: cache-cabal
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/bin
          key: ${{ runner.os }}-agda-2.8.0-ghc-9.10.1-v2

      - name: Install Agda 2.8.0
        if: steps.cache-cabal.outputs.cache-hit != 'true'
        run: |
          cabal update
          cabal install Agda-2.8.0 --overwrite-policy=always

      - name: Restore executable permissions
        run: chmod -R +x ~/.cabal/bin || true

      - name: Verify Agda installation
        run: agda --version

      - name: Checkout agda-stdlib v2.4
        run: |
          git clone --depth 1 --branch v2.4 https://github.com/agda/agda-stdlib.git

      - name: Checkout agda-categories 0.3.0
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/agda/agda-categories.git | awk -F'refs/tags/' '{print $2}' | grep -E '^v?0\.3\.0$' | head -n1)
          echo "Resolved agda-categories tag: '${TAG}'"
          : "${TAG:?ERROR: no tag matching 0.3.0 / v0.3.0 found on agda-categories}"
          git clone --depth 1 --branch "$TAG" https://github.com/agda/agda-categories.git

      - name: Patch agda-categories .agda-lib (cubical-compatible + stdlib version)
        run: |
          LIB=agda-categories/agda-categories.agda-lib
          echo "--- $LIB before ---"; cat "$LIB"
          if grep -q '^flags:' "$LIB"; then
            grep -q -- '--cubical-compatible' "$LIB" || sed -i 's/^flags:.*/& --cubical-compatible/' "$LIB"
          else
            printf 'flags: --cubical-compatible\n' >> "$LIB"
          fi
          sed -i 's/standard-library-[0-9.]\+/standard-library-2.4/g' "$LIB"
          echo "--- $LIB after ---"; cat "$LIB"

      - name: Register Agda libraries
        run: |
          mkdir -p ~/.config/agda
          echo "$(pwd)/agda-stdlib/standard-library.agda-lib"     >> ~/.config/agda/libraries
          echo "$(pwd)/agda-categories/agda-categories.agda-lib" >> ~/.config/agda/libraries
          echo "standard-library" >> ~/.config/agda/defaults
          echo "agda-categories"  >> ~/.config/agda/defaults

      - name: Generate Agda HTML documentation
        run: make html

      - name: Auto-generate Dependency Graphs
        run: |
          agda --dependency-graph=src/deps.dot src/Everything.agda
          
          python3 - << 'EOF'
          import re
          import subprocess

          def filter_and_generate(in_file, out_dot, prefixes, out_html):
              nodes = {}
              edges = []
              node_re = re.compile(r'\s*(m\d+)\[label="([^"]+)"\];')
              edge_re = re.compile(r'\s*(m\d+)\s*->\s*(m\d+);')
              
              with open(in_file) as f:
                  for line in f:
                      m = node_re.match(line)
                      if m:
                          nodes[m.group(1)] = m.group(2)
                          continue
                      m = edge_re.match(line)
                      if m:
                          edges.append((m.group(1), m.group(2)))
                          
              keep = {i for i, name in nodes.items() if any(name.startswith(p) for p in prefixes)}
              kept_edges = [(a, b) for a, b in edges if a in keep and b in keep]
              
              with open(out_dot, 'w') as f:
                  f.write('digraph dependencies {\n')
                  for i, name in nodes.items():
                      if i in keep:
                          f.write(f'   {i}[label="{name}"];\n')
                  for a, b in kept_edges:
                      f.write(f'   {a} -> {b};\n')
                  f.write('}\n')
              
              subprocess.run(['python3', 'src/dot_to_html.py', out_dot, out_html], check=True)

          project_prefixes = ('Base.', 'Cosmos.', 'Equivalence.', 'Physics.', 'Real.', 'SecondPass.', 'SketchPass.', 'Wellspring.', 'Everything')
          filter_and_generate('src/deps.dot', 'deps-project.dot', project_prefixes, 'deps-project.html')

          real_prefixes = ('Real',)
          filter_and_generate('src/deps.dot', 'deps-real.dot', real_prefixes, 'deps-real.html')
          EOF

      - name: Copy interactive HTML to docs
        run: |
          cp deps-project.html ./docs/ || true
          cp deps-real.html ./docs/ || true

      - name: Inject interactive graph link into index.html
        run: |
          python3 - << 'EOF'
          import os
          import re

          index_path = './docs/index.html'
          if os.path.exists(index_path):
              def get_node_count(filepath):
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f:
                          content = f.read()
                          m = re.search(r'Nodes:\s*(\d+)', content)
                          if m: return m.group(1)
                  except:
                      pass
                  return "?"

              proj_nodes = get_node_count('deps-project.html')
              real_nodes = get_node_count('deps-real.html')

              with open(index_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              injected_html = f"<br><span style=\"font-family: sans-serif; font-size: 14px; white-space: nowrap;\">Interactive Graphs: <a href=\"deps-project.html\" target=\"_blank\" style=\"color: #0366d6; text-decoration: none; font-weight: 600; margin-left: 8px;\">Full Project ({proj_nodes} nodes)</a> <span style=\"color: #d1d5da; margin: 0 8px;\">|</span> <a href=\"deps-real.html\" target=\"_blank\" style=\"color: #28a745; text-decoration: none; font-weight: 600;\">Real Module ({real_nodes} nodes)</a></span><br>"
              
              pattern = r'(<a\s+[^>]*href="Everything\.html"[^>]*>Everything</a>)\s*'
              
              if re.search(pattern, content):
                  content = re.sub(pattern, r'\1' + injected_html, content, count=1)
              else:
                  target_text = 'import Everything'
                  if target_text in content:
                      content = content.replace(target_text, target_text + injected_html, 1)
                  else:
                      target_all = '-- All modules'
                      if target_all in content:
                          content = content.replace(target_all, injected_html + target_all, 1)
                  
              with open(index_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          else:
              print("Error: ./docs/index.html not found!")
          EOF

      - name: Debug – list generated files
        run: |
          echo "=== docs/ tree (first 80) ==="
          find ./docs -type f | sort | head -80
          echo ""
          echo "=== index.html / Everything.html locations ==="
          find ./docs -name 'index.html'
          find ./docs -name 'Everything.html'
          echo ""
          echo "=== Sample of absolute links (before fix) ==="
          grep -oP 'href="/[^"]*"' "$(find ./docs -name 'index.html' | head -1)" | head -10 || true

      - name: Rewrite absolute paths for /ALMA/ subpath
        run: |
          # HTML: href="/xxx" → href="/ALMA/xxx"  (排除 //)
          find ./docs -type f -name '*.html' \
            -exec sed -i 's|href="/\([^/]\)|href="/ALMA/\1|g' {} +

          # HTML: src="/xxx" → src="/ALMA/xxx"
          find ./docs -type f -name '*.html' \
            -exec sed -i 's|src="/\([^/]\)|src="/ALMA/\1|g' {} +

          # CSS: url(/xxx) → url(/ALMA/xxx)
          find ./docs -type f -name '*.css' \
            -exec sed -i 's|url(/\([^/]\)|url(/ALMA/\1|g' {} +

          echo "=== Sample after fix ==="
          grep -oP 'href="[^"]*"' "$(find ./docs -name 'index.html' | head -1)" | head -10 || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
