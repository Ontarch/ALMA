 "m572", "target": "m544"}, {"source": "m572", "target": "m545"}, {"source": "m572", "target": "m547"}, {"source": "m572", "target": "m555"}, {"source": "m572", "target": "m566"}, {"source": "m572", "target": "m567"}, {"source": "m572", "target": "m592"}, {"source": "m572", "target": "m594"}, {"source": "m572", "target": "m600"}, {"source": "m572", "target": "m612"}, {"source": "m572", "target": "m636"}, {"source": "m572", "target": "m640"}, {"source": "m572", "target": "m645"}, {"source": "m572", "target": "m661"}, {"source": "m572", "target": "m667"}, {"source": "m572", "target": "m670"}, {"source": "m572", "target": "m681"}, {"source": "m573", "target": "m214"}, {"source": "m574", "target": "m29"}, {"source": "m574", "target": "m472"}, {"source": "m574", "target": "m605"}, {"source": "m588", "target": "m305"}, {"source": "m592", "target": "m124"}, {"source": "m592", "target": "m631"}, {"source": "m592", "target": "m665"}, {"source": "m593", "target": "m208"}, {"source": "m594", "target": "m220"}, {"source": "m600", "target": "m132"}, {"source": "m600", "target": "m193"}, {"source": "m600", "target": "m399"}, {"source": "m601", "target": "m344"}, {"source": "m601", "target": "m605"}, {"source": "m601", "target": "m633"}, {"source": "m603", "target": "m453"}, {"source": "m605", "target": "m38"}, {"source": "m605", "target": "m614"}, {"source": "m606", "target": "m698"}, {"source": "m607", "target": "m175"}, {"source": "m612", "target": "m105"}, {"source": "m614", "target": "m161"}, {"source": "m619", "target": "m556"}, {"source": "m620", "target": "m219"}, {"source": "m624", "target": "m534"}, {"source": "m629", "target": "m131"}, {"source": "m631", "target": "m298"}, {"source": "m633", "target": "m606"}, {"source": "m636", "target": "m342"}, {"source": "m638", "target": "m482"}, {"source": "m640", "target": "m502"}, {"source": "m645", "target": "m124"}, {"source": "m645", "target": "m516"}, {"source": "m645", "target": "m631"}, {"source": "m646", "target": "m132"}, {"source": "m654", "target": "m614"}, {"source": "m655", "target": "m481"}, {"source": "m657", "target": "m127"}, {"source": "m661", "target": "m56"}, {"source": "m661", "target": "m94"}, {"source": "m665", "target": "m374"}, {"source": "m668", "target": "m317"}, {"source": "m668", "target": "m381"}, {"source": "m668", "target": "m606"}, {"source": "m670", "target": "m516"}, {"source": "m674", "target": "m374"}, {"source": "m676", "target": "m111"}, {"source": "m681", "target": "m429"}, {"source": "m682", "target": "m502"}, {"source": "m685", "target": "m240"}, {"source": "m691", "target": "m502"}, {"source": "m695", "target": "m183"}, {"source": "m698", "target": "m401"}];

  const viewport = document.getElementById('viewport');
  const container = document.getElementById('nodes-container');
  const svg = document.getElementById('lines');
  const nodeElements = {};
  const nodeDims = {};

  // 1. 初始化节点
  nodesData.forEach((n) => {
    const div = document.createElement('div');
    div.className = 'node';
    div.id = 'node-' + n.id;
    div.textContent = n.label;
    container.appendChild(div);
    nodeElements[n.id] = div;
  });

  nodesData.forEach((n, i) => {
    const rect = nodeElements[n.id].getBoundingClientRect();
    nodeDims[n.id] = { w: rect.width, h: rect.height };
    n.x = (Math.random() - 0.5) * 2000;
    n.y = (Math.random() - 0.5) * 2000;
    n.vx = 0; n.vy = 0;
  });

  // 2. 物理引擎
  const MAX_COORD = 5000;
  for (let iter = 0; iter < 300; iter++) {
    for (let i = 0; i < nodesData.length; i++) {
      for (let j = i + 1; j < nodesData.length; j++) {
        const n1 = nodesData[i], n2 = nodesData[j];
        let dx = n2.x - n1.x;
        let dy = n2.y - n1.y;
        let distSq = dx*dx + dy*dy;
        if (distSq === 0) distSq = 0.1;
        let dist = Math.sqrt(distSq);
        
        if (dist < 1000) {
          let force = 30000 / distSq; 
          let fx = (dx / dist) * force;
          let fy = (dy / dist) * force;
          n1.vx -= fx; n1.vy -= fy;
          n2.vx += fx; n2.vy += fy;
        }
      }
    }

    edgesData.forEach(e => {
      const n1 = nodesData.find(n => n.id === e.source);
      const n2 = nodesData.find(n => n.id === e.target);
      let dx = n2.x - n1.x;
      let dy = n2.y - n1.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 0.1;
      
      let targetDist = 300; 
      let force = (dist - targetDist) * 0.03;
      
      let fx = (dx / dist) * force;
      let fy = (dy / dist) * force;
      
      n1.vx += fx; n1.vy += fy;
      n2.vx -= fx; n2.vy -= fy;
    });

    nodesData.forEach(n => {
      n.vx -= n.x * 0.01;
      n.vy -= n.y * 0.01;
      n.vx *= 0.8; n.vy *= 0.8;
      
      n.vx = Math.max(-20, Math.min(20, n.vx));
      n.vy = Math.max(-20, Math.min(20, n.vy));
      
      n.x += n.vx; n.y += n.vy;
      
      if (n.x > MAX_COORD) n.x = MAX_COORD;
      if (n.x < -MAX_COORD) n.x = -MAX_COORD;
      if (n.y > MAX_COORD) n.y = MAX_COORD;
      if (n.y < -MAX_COORD) n.y = -MAX_COORD;
    });
  }

  // 3. 坐标平移与边界计算
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodesData.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
  });

  const padding = 500;
  const offsetX = -minX + padding;
  const offsetY = -minY + padding;
  const totalWidth = maxX - minX + padding * 2;
  const totalHeight = maxY - minY + padding * 2;

  viewport.style.width = totalWidth + 'px';
  viewport.style.height = totalHeight + 'px';
  svg.setAttribute('width', totalWidth);
  svg.setAttribute('height', totalHeight);

  nodesData.forEach(n => {
    n.x += offsetX; n.y += offsetY;
    nodeElements[n.id].style.left = n.x + 'px';
    nodeElements[n.id].style.top = n.y + 'px';
  });

  // 4. 绘制曲线连线
  edgesData.forEach(e => {
    const n1 = nodesData.find(n => n.id === e.source);
    const n2 = nodesData.find(n => n.id === e.target);
    const d1 = nodeDims[e.source];
    const d2 = nodeDims[e.target];
    
    const angle = Math.atan2(n2.y - n1.y, n2.x - n1.x);
    const r1x = (d1.w / 2) + 2; const r1y = (d1.h / 2) + 2;
    const r2x = (d2.w / 2) + 8; const r2y = (d2.h / 2) + 8;

    const x1 = n1.x + Math.cos(angle) * r1x;
    const y1 = n1.y + Math.sin(angle) * r1y;
    const x2 = n2.x - Math.cos(angle) * r2x;
    const y2 = n2.y - Math.sin(angle) * r2y;

    const cx = (x1 + x2) / 2 - (y2 - y1) / 8;
    const cy = (y1 + y2) / 2 + (x2 - x1) / 8;
    const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', 'url(#arrow)');
    path.id = `path-${e.source}-${e.target}`;
    svg.appendChild(path);
  });

  // 5. 视图初始化与缩放核心逻辑 (修复了偏移问题)
  let scale = Math.min(window.innerWidth / totalWidth, window.innerHeight / totalHeight) * 0.9;
  scale = Math.min(Math.max(scale, 0.05), 1.0);
  
  // 让图的中心对齐到屏幕中心
  let translateX = (window.innerWidth - totalWidth * scale) / 2;
  let translateY = (window.innerHeight - totalHeight * scale) / 2;

  const updateTransform = () => {
    viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  };
  updateTransform();

  let isDragging = false;
  let startX, startY;

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.node') || e.target.id === 'search') return;
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
    clearHighlight();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateTransform();
  });

  document.addEventListener('mouseup', () => isDragging = false);

  // 修复缩放中心点定位的数学公式
  document.addEventListener('wheel', (e) => {
    if (e.ctrlKey) return;
    e.preventDefault();
    
    const oldScale = scale;
    const zoomSensitivity = 0.001;
    scale -= e.deltaY * zoomSensitivity;
    scale = Math.min(Math.max(0.02, scale), 3); // 限制范围
    
    // 鼠标当前位置的屏幕坐标
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    // 核心公式：确保鼠标指向的视口位置在缩放前后不变
    translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
    translateY = mouseY - (mouseY - translateY) * (scale / oldScale);
    
    updateTransform();
  }, { passive: false });

  // 6. 高亮交互
  function clearHighlight() {
    document.querySelectorAll('.node').forEach(el => el.className = 'node');
    document.querySelectorAll('path').forEach(el => {
      el.style.display = 'block';
      el.classList.remove('highlight');
      el.setAttribute('marker-end', 'url(#arrow)');
    });
  }

  let selectedNodeId = null;

  function highlightNode(nodeId) {
    if (selectedNodeId === nodeId) {
      selectedNodeId = null;
      clearHighlight();
      return;
    }
    selectedNodeId = nodeId;
    clearHighlight();

    const neighbors = new Set();
    neighbors.add(nodeId);
    edgesData.forEach(e => {
      if (e.source === nodeId) neighbors.add(e.target);
      if (e.target === nodeId) neighbors.add(e.source);
    });

    nodesData.forEach(n => {
      if (neighbors.has(n.id)) nodeElements[n.id].classList.add('highlight');
      else nodeElements[n.id].classList.add('faded');
    });

    edgesData.forEach(e => {
      const path = document.getElementById(`path-${e.source}-${e.target}`);
      if (e.source === nodeId || e.target === nodeId) {
        path.classList.add('highlight');
        path.setAttribute('marker-end', 'url(#arrow-hl)');
      } else {
        path.style.display = 'none';
      }
    });
  }

  nodesData.forEach(n => {
    nodeElements[n.id].addEventListener('click', (e) => {
      e.stopPropagation();
      highlightNode(n.id);
    });
  });

  // 7. 搜索
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      clearHighlight();
      return;
    }
    
    const matched = new Set();
    nodesData.forEach(n => {
      if (n.label.toLowerCase().includes(q)) matched.add(n.id);
    });

    clearHighlight();

    nodesData.forEach(n => {
      if (matched.has(n.id)) nodeElements[n.id].classList.add('highlight');
      else nodeElements[n.id].classList.add('faded');
    });

    edgesData.forEach(e => {
      const path = document.getElementById(`path-${e.source}-${e.target}`);
      if (matched.has(e.source) && matched.has(e.target)) {
        path.classList.add('highlight');
        path.setAttribute('marker-end', 'url(#arrow-hl)');
      } else {
        path.style.display = 'none';
      }
    });
  });
